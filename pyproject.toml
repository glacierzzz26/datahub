[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datahub"
version = "0.0.0"
description = "数据接入层：独立采集/取数服务，对外 MCP + HTTP 双出口"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.0",
    "mcp==1.30.0",
    "requests==2.32.5",
    "akshare>=1.14",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
packages = [
    "app",
    "app.datasets",
    "app.models",
    "app.providers",
    "app.providers.ext",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
